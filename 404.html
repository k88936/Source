<!doctype html>
<html class="dark" lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
        <meta name="color-scheme" content="dark light" />

        <script>
            try {
                const preference = JSON.parse(localStorage.getItem('immich-ui-theme'));
                const prefersDark = globalThis.matchMedia('(prefers-color-scheme: dark)').matches;
                if (preference === 'light' || (preference !== 'dark' && !prefersDark)) {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.classList.add('light');
                }
            } catch {
                // noop
            }
        </script>

        <style>html,body,#app{height:100%;margin:0;padding:0}html.dark{background-color:#000}html.light{background-color:#fff}</style>

        <title>Source</title>

    </head>

    </body>
</html>
