[package]
name = "source-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
ts-rs = { workspace = true }

# Domain and use cases
async-trait = "0.1"
imagesize = "0.14"
kamadak-exif = "0.6"
mime_guess = "2"
regex = "1"
time = { version = "0.3", features = ["macros", "parsing"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"

# SQLite adapter
diesel = { version = "2.3", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
diesel-async = { version = "0.9", features = ["sqlite", "sync-connection-wrapper", "deadpool"] }
diesel_migrations = "2.3"
libsqlite3-sys = { version = "0.35", features = ["bundled"] }

# Cloudreve adapter
anyhow = "1"
cloudreve-sdk-api = { git = "https://github.com/k88936/cloudreve-sdk-rs", rev = "060275e4b1c4c168ee31744345c7c2314bfdd67d", version = "0.1.1" }
cloudreve-sdk-uploader = { git = "https://github.com/k88936/cloudreve-sdk-rs", rev = "060275e4b1c4c168ee31744345c7c2314bfdd67d", version = "0.2.0" }
futures = "0.3"
urlencoding = "2"

# Media adapter
sha2 = "0.10"
base64 = "0.22"
jpeg-decoder = { version = "0.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# Shared by the Cloudreve and media adapters
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
