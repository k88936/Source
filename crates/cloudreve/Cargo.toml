[package]
name = "source-cloudreve"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
source-core = { path = "../core" }
async-trait = "0.1"
anyhow = "1"
cloudreve-sdk-api = { path = "../../../cloudreve-sdk-rs/crates/cloudreve-sdk-api" }
cloudreve-sdk-uploader = { path = "../../../cloudreve-sdk-rs/crates/cloudreve-sdk-uploader" }
futures = "0.3"
tokio = { version = "1", features = ["sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
urlencoding = "2"
